<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LedgerBox — Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{padding-top:56px}
    .ledger-list .list-group-item{cursor:pointer}
    .tx-time{font-size:0.85rem;color:#666}
    .small-muted{font-size:0.85rem;color:#6c757d}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">LedgerBox Demo</a>
  </div>
</nav>
<div class="container">
  <div class="row">
    <div class="col-md-4">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">账本</h5>
          <div class="list-group ledger-list" id="ledgerList"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-body small-muted">快速响应式演示，支持 AA 结算预览与本地添加模拟交易（不持久化）</div>
      </div>
    </div>
    <div class="col-md-8">
      <div id="ledgerPanel" class="card d-none">
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <h4 id="ledgerName"></h4>
            <div><button id="backBtn" class="btn btn-outline-secondary btn-sm">返回</button></div>
          </div>
          <div class="row mb-3">
            <div class="col"><div class="small-muted">参与者</div><div id="participants"></div></div>
            <div class="col"><div class="small-muted">账户</div><div id="accounts"></div></div>
          </div>

          <h6>交易</h6>
          <ul class="list-group mb-3" id="txList"></ul>

          <div class="mb-3">
            <h6>添加交易（本地）</h6>
            <div class="input-group mb-2"><input id="note" class="form-control" placeholder="说明"></div>
            <div class="input-group mb-2"><input id="amount" type="number" class="form-control" placeholder="金额"></div>
            <button id="createBtn" class="btn btn-success btn-sm">提交（本地）</button>
            <button id="settleBtn" class="btn btn-primary btn-sm ms-2">生成 AA 结算</button>
          </div>

          <h6>结算计划</h6>
          <ul class="list-group" id="plan"></ul>
        </div>
      </div>

      <div id="emptyHint" class="card text-center">
        <div class="card-body">选择左侧一个账本查看详情</div>
      </div>
    </div>
  </div>
</div>

<script>
// Embedded demo data
const DEMO_DATA = 
{"ledgers": [{"id": "ledger-demo-1", "name": "个人账本", "type": "personal", "base_currency": "USD"}, {"id": "ledger-demo-2", "name": "情侣账本", "type": "couple", "base_currency": "USD"}], "participants": {"ledger-demo-1": [{"user_id": "u1", "name": "我"}], "ledger-demo-2": [{"user_id": "u1", "name": "我"}, {"user_id": "u2", "name": "TA"}]}, "accounts": {"ledger-demo-1": [{"id": "a1", "name": "现金", "currency": "USD", "current_balance": 100}], "ledger-demo-2": [{"id": "a2", "name": "银行卡", "currency": "USD", "current_balance": 200}]}, "transactions": {"ledger-demo-1": [{"id": "t1", "account_id": "a1", "actor_user_id": "u1", "kind": "expense", "total_amount": 12.5, "currency": "USD", "note": "午餐", "occurred_at": "2026-07-20T12:00:00Z", "items": [{"id": "ti1", "user_id": "u1", "role": "payer", "amount": 12.5, "currency": "USD"}]}], "ledger-demo-2": [{"id": "t-1785231776354", "account_id": "a2", "actor_user_id": null, "kind": "expense", "total_amount": 5, "currency": "USD", "note": "", "occurred_at": "2026-07-28T09:42:56.354Z", "items": [{"id": "ti-1785231776354-0", "user_id": "u1", "role": "payer", "amount": 5, "currency": "USD"}]}, {"id": "t2", "account_id": "a2", "actor_user_id": "u1", "kind": "expense", "total_amount": 30, "currency": "USD", "note": "晚餐", "occurred_at": "2026-07-25T19:00:00Z", "items": [{"id": "ti2", "user_id": "u1", "role": "payer", "amount": 30, "currency": "USD"}, {"id": "ti3", "user_id": "u2", "role": "beneficiary", "amount": 15, "currency": "USD"}, {"id": "ti4", "user_id": "u1", "role": "beneficiary", "amount": 15, "currency": "USD"}]}]}}
;

const el = id => document.getElementById(id);
const ledgerListEl = el('ledgerList');
const ledgerPanel = el('ledgerPanel');
const ledgerName = el('ledgerName');
const participantsEl = el('participants');
const accountsEl = el('accounts');
const txListEl = el('txList');
const planEl = el('plan');
const backBtn = el('backBtn');
const createBtn = el('createBtn');
const noteInput = el('note');
const amountInput = el('amount');
const settleBtn = el('settleBtn');

let currentLedger = null;

function formatDate(s){ try{ return new Date(s).toLocaleString(); }catch(e){return s} }

function computeSettlementPlan(userBalances) {
  const creditors = []; const debtors = [];
  for (const [uid, bal] of Object.entries(userBalances)){
    const v = Number(bal);
    if (v > 0.0001) creditors.push({ user_id: uid, amount: Number(v.toFixed(8)) });
    else if (v < -0.0001) debtors.push({ user_id: uid, amount: Number((-v).toFixed(8)) });
  }
  creditors.sort((a,b)=>b.amount-a.amount); debtors.sort((a,b)=>b.amount-a.amount);
  const settlements = []; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){ const d=debtors[i], c=creditors[j]; const pay=Math.min(d.amount,c.amount); const pr=Number(pay.toFixed(4)); settlements.push({ from_user_id:d.user_id, to_user_id:c.user_id, amount:pr }); d.amount=Number((d.amount-pay).toFixed(8)); c.amount=Number((c.amount-pay).toFixed(8)); if(d.amount<=1e-8)i++; if(c.amount<=1e-8)j++; }
  return settlements;
}

function renderLedgers(){ ledgerListEl.innerHTML=''; (DEMO_DATA.ledgers||[]).forEach(l=>{ const a=document.createElement('a'); a.className='list-group-item list-group-item-action'; a.href='#'; a.textContent=`${l.name} (${l.type})`; a.onclick=e=>{e.preventDefault(); openLedger(l.id)}; ledgerListEl.appendChild(a); }); }

function openLedger(id){ currentLedger=id; const ledger = (DEMO_DATA.ledgers||[]).find(x=>x.id===id)||{}; ledgerName.textContent=ledger.name || id; participantsEl.textContent=(DEMO_DATA.participants[id]||[]).map(p=>p.name).join(', '); accountsEl.textContent=(DEMO_DATA.accounts[id]||[]).map(a=>`${a.name}: ${a.current_balance} ${a.currency}`).join(' | ');
  const txs = DEMO_DATA.transactions[id]||[]; txListEl.innerHTML=''; txs.forEach(t=>{ const li=document.createElement('li'); li.className='list-group-item'; const title=`${t.note||'(无说明)'} — ${t.total_amount} ${t.currency}`; li.innerHTML=`<div class="d-flex justify-content-between"><div><strong>${title}</strong><div class="tx-time">${formatDate(t.occurred_at)}</div></div></div>`; txListEl.appendChild(li); });
  ledgerPanel.classList.remove('d-none'); el('emptyHint').classList.add('d-none'); }

backBtn.onclick=()=>{ ledgerPanel.classList.add('d-none'); el('emptyHint').classList.remove('d-none'); }

createBtn.onclick=()=>{ const note=noteInput.value; const amount=Number(amountInput.value||0); if(!currentLedger)return alert('请选择账本'); const ledgerTxs=DEMO_DATA.transactions[currentLedger]=(DEMO_DATA.transactions[currentLedger]||[]); const newTxn={ id:'local-'+Date.now(), account_id:(DEMO_DATA.accounts[currentLedger]&&DEMO_DATA.accounts[currentLedger][0]&&DEMO_DATA.accounts[currentLedger][0].id)||null, actor_user_id:null, kind:'expense', total_amount:amount, currency:(DEMO_DATA.ledgers.find(l=>l.id===currentLedger)||{}).base_currency||'USD', note, occurred_at:new Date().toISOString(), items:[{ id:'local-item-'+Date.now(), user_id:(DEMO_DATA.participants[currentLedger]&&DEMO_DATA.participants[currentLedger][0]&&DEMO_DATA.participants[currentLedger][0].user_id)||'u1', role:'payer', amount, currency:(DEMO_DATA.ledgers.find(l=>l.id===currentLedger)||{}).base_currency||'USD' }] }; ledgerTxs.unshift(newTxn); openLedger(currentLedger); alert('已在本地添加（非持久化）'); }

settleBtn.onclick=()=>{ if(!currentLedger) return alert('请选择账本'); const txs = DEMO_DATA.transactions[currentLedger]||[]; const balances = {}; for(const t of txs){ for(const it of (t.items||[])){ const uid=it.user_id||'unknown'; balances[uid]=balances[uid]||0; if(it.role==='payer') balances[uid]+=Number(it.amount); else if(it.role==='beneficiary') balances[uid]-=Number(it.amount); } } const plan=computeSettlementPlan(balances).map(p=>({ ...p, currency:(DEMO_DATA.ledgers.find(l=>l.id===currentLedger)||{}).base_currency||'USD' })); planEl.innerHTML=''; plan.forEach(p=>{ const li=document.createElement('li'); li.className='list-group-item'; li.textContent=`${p.from_user_id} → ${p.to_user_id} : ${p.amount} ${p.currency}`; planEl.appendChild(li); }); }

renderLedgers();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
